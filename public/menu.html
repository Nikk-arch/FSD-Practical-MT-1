<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Menu</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 18px; color: #222; }
    h1 { color: #a33b20; } table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    th { background: #f3e5df; }
  </style>
</head>
<body>
  <h1>Our Food Menu</h1>
  <p>Freshly prepared favourites from our kitchen.</p>
  <table>
    <thead><tr><th>Food Item</th><th>Category</th><th>Price (₹)</th></tr></thead>
    <tbody>
      <tr><td>Pizza</td><td>Fast Food</td><td>250</td></tr>
      <tr><td>Burger</td><td>Fast Food</td><td>120</td></tr>
      <tr><td>Cold Coffee</td><td>Beverage</td><td>100</td></tr>
      <tr><td>Sandwich</td><td>Snacks</td><td>90</td></tr>
    </tbody>
  </table>
  <p><a href="/">Back to home</a></p>
</body>
</html>
